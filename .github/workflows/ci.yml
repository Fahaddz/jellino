name: CI

on:
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: "Guard: zero comments in src/"
        run: |
          COMMENTS=$(grep -rnE '^[[:space:]]*(//|/\*)' src/ || true)
          if [ -n "$COMMENTS" ]; then
            echo "Comments found in src/:"
            echo "$COMMENTS"
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun x vitest run
